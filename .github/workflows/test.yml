# Unit tests for the parts that touch the player's game files: the search-path patch, the VPK
# reader/writer, language-folder detection and the item schema. A regression in any of them is
# invisible until someone's game stops working, so they run on every push.
name: Tests

on:
  push:
    branches:
      - main
      - v2
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 for the test runner, not the 20 Electron bundles: the tests use zlib.crc32
      # (Node 22+). Nothing under test/ or tools/ is packaged into the app - the build's file
      # list is main.js, preload.js, src/, renderer/ - so this cannot drift into runtime code.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # This used to skip installing on the grounds that the modules under test were
      # dependency-free. That stopped being true once the tests reached the installer and the
      # toolchain, which pull in adm-zip, and every run since has failed on a missing module
      # while a developer's machine passed because node_modules was already there.
      - name: Install dependencies
        run: npm ci

      # A name that is not there is not something a test can see.
      #
      # Splitting registerIpc on 2026-09-06 moved a call into one file and left the function it
      # called in another. Every test passed - the contract test reads these files as text, and
      # the unit tests never load a module that needs Electron - and two releases shipped in
      # which no mod could be installed at all. The same split left a second one in
      # ipc-presets.js that nobody had hit yet.
      #
      # `no-undef` names both in under a second. It runs before the suite because when it fails
      # there is no point reading anything below it.
      - name: Check for names that do not exist
        run: npm run lint

      # Coverage is a floor, not a target. The numbers sit just under what the suite reaches,
      # so the gate does not fail on the state it was written in and does fail the moment
      # somebody adds code nothing exercises. Raise them when the real figure moves up; never
      # lower them to make a run green.
      #
      # The figure differs by platform and the floor has to clear the lower one. src/steam.js
      # asks which operating system it is on and takes a different half of itself on each, so
      # this runner reports 76.7 lines / 81.8 branches / 75.3 functions where a Windows machine
      # reports 76.2 / 82.2 / 74.6. A floor calibrated on one of them fails on the other, which
      # is how this comment came to be written.
      #
      # Node only reports files a test loaded, so a module with no test at all is invisible
      # here rather than counted as zero. Several modules are still in that position - the gate
      # holds the line, it does not claim the line is where it should be.
      #
      # The floor moved down on 2026-09-10, from 76/81/74, and the reason is the opposite of the
      # usual one. The contract test now registers all nine src/ipc-*.js modules and calls every
      # handler, so those files are loaded and counted for the first time. They are large and
      # thinly covered, and the aggregate fell about two points because code that was invisible
      # became visible. Nothing stopped being tested. Raise this again by testing those handlers,
      # not by hiding them.
      - name: Run tests with a coverage floor
        run: npm run test:coverage

  # The same suite on the operating system most of these users are actually on. Issue #5.
  #
  # A separate job rather than a matrix on the one above, because the branch ruleset requires a
  # status check named exactly `test`, and a matrix renames it to `test (ubuntu-latest)`. The
  # gate would then wait forever for a check that no longer exists.
  #
  # No coverage floor here on purpose. Coverage is a property of the suite, not of the machine
  # running it, and the two platforms genuinely report different figures because src/steam.js
  # takes a different half of itself on each. One floor, enforced once, on the runner it was
  # calibrated against. This job is here to catch what only breaks on Windows: a path separator,
  # a case-insensitive filesystem, a locked file.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
