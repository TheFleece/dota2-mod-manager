name: Mirror

# A second home for the source, so "read the code" survives this repository going away.
#
# This is a Dota modding tool. The realistic ways it disappears are a takedown, a suspended
# account, or GitHub deciding something about the catalog it installs from - none of which give
# notice, and all of which take the build logs, the release history and the issue trail with
# them. A mirror is twenty lines and removes that as a single point of failure.
#
# Force-push on purpose: this is a copy, not a fork with a life of its own. It is where the code
# can be read if GitHub cannot be, and nothing is developed there.
#
# It used to name Codeberg, which was set up on 2026-09-08 and stood down the same day: their
# terms of use ask projects written with heavy use of language models not to host there, and
# AGENTS.md says this one is. Naming the host in the workflow meant a decision about where to
# keep a copy turned into a code change, so it does not name one any more. Point MIRROR_PUSH_URL
# at whatever the second home turns out to be and this starts working; leave it unset and the
# job says so and exits green, gating nothing.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: github.repository == 'TheFleece/dota2-mod-manager'
    steps:
      - uses: actions/checkout@v7
        with:
          # the whole history, or the mirror is a repository with one commit in it
          fetch-depth: 0

      - name: Push to the mirror
        env:
          # The whole push URL, credentials and all: https://user:token@host/owner/repo.git
          MIRROR_PUSH_URL: ${{ secrets.MIRROR_PUSH_URL }}
        run: |
          if [ -z "$MIRROR_PUSH_URL" ]; then
            echo "::notice::No mirror configured - set the MIRROR_PUSH_URL secret to have one"
            exit 0
          fi
          # Say where it went without printing what got it there. The secret itself is masked in
          # the log; the host is not the secret, so it prints, and a run that pushed somewhere
          # unexpected is visible rather than silent.
          host="$(printf '%s' "$MIRROR_PUSH_URL" | sed -E 's#^[a-z]+://[^@]*@##; s#/.*$##')"
          echo "Mirroring main and every tag to $host"
          git remote add mirror "$MIRROR_PUSH_URL"

          # A tag build checks out the tag, so HEAD is detached and there is no local main to
          # push: "src refspec main does not match any", every release, while the branch push
          # a moment earlier had already carried the same commit. Red on every release teaches
          # people to stop reading CI, so the branch is fetched by name and pushed by name.
          git fetch --no-tags --force origin refs/heads/main:refs/heads/main
          git push --force mirror refs/heads/main:refs/heads/main
          git push --force mirror --tags
