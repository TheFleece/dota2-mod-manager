name: Fingerprints

# Keeps fingerprints.json in sync with the catalog: new/changed mods are fetched and
# fingerprinted, unchanged ones are skipped (state is checkpointed in the repo), and the
# result is committed only when it actually changes. Pushes to main here don't build a
# release (that workflow triggers on v* tags only).
#
# It also rebuilds the site's hero pages, because they are made of the same downloads. The job
# already opens every archive to fingerprint it and works out which heroes each one is about;
# the site then needs the catalog's preview for those same mods. Doing it anywhere else means
# fetching the catalog twice and having two answers to when it last changed.
#
# Node 24 rather than 20: tools/catalog.mjs imports the site's TypeScript directly, which older
# Node cannot read.

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min; a no-op unless the catalog changed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fingerprints
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pushed back with the owner's token where there is one. main's ruleset asks for a
          # green test run before any push, and the workflow's own token is not an admin, so a
          # commit made here is refused. The owner is on the bypass list. With no secret set
          # this is the default token and the behaviour it had before.
          token: ${{ secrets.BOT_PUSH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps (skip the electron binary — not needed here)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Regenerate fingerprints (incremental)
        run: node tools/gen-fingerprints.js --conc 8

      # sharp, for reading each preview's size and for refusing the two catalog entries that
      # are mp4 files wearing a .webp name
      - name: Install the site's deps
        run: npm ci --prefix site

      - name: Rebuild the hero and category pages
        run: npm run catalog --prefix site

      - name: Commit if changed
        run: |
          paths="fingerprints.json fingerprints.state.json hero-index.json site/src/data/heroes.json site/src/data/categories.json site/public/mods"
          if git diff --quiet -- $paths && [ -z "$(git ls-files --others --exclude-standard -- $paths)" ]; then
            echo "catalog unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $paths
            # [skip ci] because a push made with a real token starts workflows and the
            # default one never did. Nothing here is worth a run of anything.
            git commit -m "Update mod fingerprints and hero pages [skip ci]"
            git push
          fi
