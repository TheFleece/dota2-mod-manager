name: SEO report

# Once a week, what the search engines are seeing, as a comment on one tracking issue.
#
# An issue rather than a file: it arrives by notification, it keeps its own history, and a week
# that went badly can be replied to. One issue with a comment per week rather than a new issue
# each time, so the whole run of them reads top to bottom.
#
# Nothing here is read without a key. With no BING_API_KEY the report still posts and says so,
# which is better than a workflow that quietly does nothing for a month.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      raw:
        description: 'Print one Bing method raw instead of posting a report, e.g. GetCrawlStats'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: seo-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Answering "what does this endpoint really return" without anybody pasting the key into
      # a terminal. The key already lives here as a secret; a shell history is a worse place
      # for it. The method name goes through the environment rather than into the command,
      # because a dispatch input interpolated straight into a shell is an injection waiting to
      # be found.
      - name: Print one endpoint raw
        if: inputs.raw != ''
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          RAW: ${{ inputs.raw }}
        run: node tools/seo-report.mjs --raw "$RAW"

      # The report is echoed into the log as well as posted, so a run that goes wrong can be
      # read here. Nothing secret reaches it: the key is never printed, including in errors.
      - name: Read the consoles
        if: inputs.raw == ''
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: |
          node tools/seo-report.mjs
          cat seo-report.md

      # Find the issue by listing and matching exactly, not with --search: GitHub's search index
      # is eventually consistent, so an issue created seconds ago is not findable yet, and the
      # first run would create a second one on every attempt.
      #
      # `gh issue create` prints the new issue's URL and takes no --json, so the number comes
      # off the end of that URL.
      - name: Post it on the tracking issue
        if: inputs.raw == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Search visibility"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ -z "$number" ]; then
            url=$(gh issue create --title "$title" \
              --body "Weekly reports from the webmaster consoles land here, posted by .github/workflows/seo.yml. Each comment is one week.")
            number="${url##*/}"
            echo "created issue #$number"
          fi
          gh issue comment "$number" --body-file seo-report.md
          echo "posted to issue #$number"

      # Next week's report compares against this one.
      - name: Remember this week's numbers
        if: inputs.raw == ''
        run: |
          if ! git diff --quiet -- seo-state.json || [ -n "$(git ls-files --others --exclude-standard -- seo-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seo-state.json
            git commit -m "Update the search snapshot"
            git push
          fi
